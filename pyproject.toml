[project]
name = "dummyfiller"
version = "0.1.0"
description = "Genererar verklighetstrogen dummy-data utifrån databasscheman (SQL Server), helt offline."
requires-python = ">=3.11"
dependencies = [
    "faker>=30",
    "sqlalchemy>=2.0",
    "pyodbc>=5",
    "streamlit>=1.50",
    "pyyaml>=6",
    "pandas>=2",
    "pyarrow>=15",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dummyfiller = "dummyfiller.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dummyfiller"]

[tool.setuptools.package-data]
dummyfiller = ["diagram/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
