<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Tabelldiagram</title>
<!--
  Tabelldiagrammet i dummyfiller. Fristående HTML/JavaScript utan externa bibliotek – inget hämtas från internet.
  Sidan pratar med Streamlit via postMessage (protokollet för anpassade komponenter):
    in:  streamlit:render            {args: {tables, relations, suggestions, selected, selNonce, height}, theme}
    ut:  streamlit:setComponentValue {value: {seq, type, ...}}   – en händelse som Python tar hand om
  Händelser: select, move, connect, accept, add_column, maximize.
-->
<style>
  :root {
    --bg: #ffffff; --panel: #f4f6f9; --text: #1f2933; --accent: #2f6fde;
    --line: color-mix(in srgb, var(--text) 16%, transparent);
    --muted: color-mix(in srgb, var(--text) 58%, transparent);
    --edge: color-mix(in srgb, var(--text) 46%, transparent);
    --warn: #c77700;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; color: var(--text);
    font: 12.5px/1.35 "Source Sans Pro", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #frame { position: absolute; inset: 0; display: flex; flex-direction: column; border: 1px solid var(--line);
    border-radius: 8px; overflow: hidden; background: var(--bg); }
  #toolbar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: 0 0 auto; }
  #toolbar button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 9px; cursor: pointer; min-width: 30px; white-space: nowrap; flex: 0 0 auto; }
  #toolbar button:hover { border-color: var(--accent); color: var(--accent); }
  #maxbtn { margin-left: auto; }
  #maxbtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #zoomlabel { min-width: 44px; text-align: center; color: var(--muted); font-variant-numeric: tabular-nums; }
  #hint { margin-left: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0; }
  #legend { display: flex; gap: 10px; color: var(--muted); flex: 0 1 auto; min-width: 0; overflow: hidden; }
  @media (max-width: 1100px) { #hint { display: none; } }
  #legend span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  #viewport { position: relative; flex: 1 1 auto; overflow: hidden; cursor: grab; touch-action: none;
    background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: 22px 22px; }
  #viewport.panning { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges, #over { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
  #edges path, #over g { pointer-events: auto; }
  .edge { fill: none; stroke: var(--edge); stroke-width: 1.6; }
  .edge.manual { stroke-dasharray: 6 4; }
  .edge.sel { stroke: var(--accent); stroke-width: 2.4; }
  .edge.sugg { stroke: var(--accent); stroke-dasharray: 3 5; opacity: .75; }
  .edge.temp { stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; pointer-events: none; }
  .hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
  .suggbtn { cursor: pointer; }
  .suggbtn circle { fill: var(--accent); }
  .suggbtn text { fill: #fff; font: 700 14px/1 sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .suggbtn:hover circle { filter: brightness(1.15); }
  .elabel { fill: var(--muted); font-size: 10.5px; text-anchor: middle; pointer-events: none; }

  .node { position: absolute; width: 318px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .12); user-select: none; }
  .node.selected { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .node.excluded { opacity: .5; }
  .head { display: flex; align-items: center; gap: 7px; padding: 7px 10px 2px; cursor: move; border-radius: 8px 8px 0 0; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
  .tname { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1 1 auto; }
  .rows { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sub { padding: 0 10px 6px 27px; color: var(--muted); font-size: 11.5px; cursor: move; border-bottom: 1px solid var(--line);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col { position: relative; display: flex; align-items: center; gap: 6px; height: 24px; padding: 0 12px 0 8px; cursor: pointer; }
  .col:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); }
  .col.selected { background: color-mix(in srgb, var(--accent) 20%, transparent); }
  .col.drop { background: color-mix(in srgb, var(--accent) 30%, transparent); outline: 1px solid var(--accent); }
  .badge { flex: 0 0 22px; font-size: 9.5px; font-weight: 700; text-align: center; border-radius: 3px; color: var(--muted); }
  .badge.pk { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--text); }
  .badge.fk { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--text); }
  .cname { flex: 0 1 auto; max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col.notnull .cname { font-weight: 600; }
  .ctype { flex: 0 0 auto; color: var(--muted); font-size: 11px; }
  .cgen { margin-left: auto; flex: 0 1 auto; min-width: 0; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted); font-size: 11px; text-align: right; }
  .col.low .cgen { color: var(--warn); }
  .col.low .cgen::before { content: "⚠ "; }
  .handle { position: absolute; right: -6px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
    border: 2px solid var(--bg); opacity: 0; cursor: crosshair; }
  .col:hover .handle, .linking .handle { opacity: 1; }
  .addcol { padding: 5px 10px 6px 36px; color: var(--muted); cursor: pointer; border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; }
  .addcol:hover { background: color-mix(in srgb, var(--accent) 9%, transparent); color: var(--accent); }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; color: var(--muted);
    font-size: 14px; text-align: center; padding: 30px; pointer-events: none; }
</style>
</head>
<body>
<div id="frame">
  <div id="toolbar">
    <button id="zout" title="Zooma ut">−</button><span id="zoomlabel">100 %</span><button id="zin" title="Zooma in">+</button>
    <button id="fit" title="Visa hela diagrammet">Visa allt</button>
    <span id="hint">Klicka på en tabell eller kolumn för att redigera · dra i rubriken för att flytta · dra från pricken till höger om en kolumn till en kolumn i en annan tabell för att skapa en relation</span>
    <span id="legend"></span>
    <button id="maxbtn" title="Låt diagrammet fylla hela fönstret (Esc går tillbaka)">⛶ Maximera</button>
  </div>
  <div id="viewport">
    <div id="world"><svg id="edges" xmlns="http://www.w3.org/2000/svg"></svg><div id="nodes"></div><svg id="over" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="empty">Inga tabeller ännu.<br>Läs in ett schema under steg 1 eller skapa en tabell i panelen till höger.</div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var SVGNS = "http://www.w3.org/2000/svg";
  var CAT = { person: "#3b82d9", company: "#d18a17", transaction: "#8a5cd6", calendar: "#17a398", location: "#3f9d4b",
              reference: "#8a94a3", bridge: "#d6579a", other: "#64748b" };
  var viewport = document.getElementById("viewport"), world = document.getElementById("world");
  var nodesEl = document.getElementById("nodes"), svg = document.getElementById("edges"), over = document.getElementById("over");
  var args = null, zoom = 1, panX = 24, panY = 24, fitted = false;
  var sel = { table: null, column: null }, selNonce = null, layoutNonce = null;
  var pos = {}, drag = null, pendingArgs = null, tempPath = null;

  function post(type, data) {
    var msg = { isStreamlitMessage: true, type: type };
    for (var k in (data || {})) { msg[k] = data[k]; }
    window.parent.postMessage(msg, "*");
  }
  function emit(ev) {
    ev.seq = Date.now() + ":" + Math.random().toString(36).slice(2, 8);
    post("streamlit:setComponentValue", { value: ev, dataType: "json" });
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text !== undefined && text !== null) { e.textContent = text; }
    return e;
  }
  function sv(tag, attrs) {
    var e = document.createElementNS(SVGNS, tag);
    for (var k in attrs) { e.setAttribute(k, attrs[k]); }
    return e;
  }
  function closest(node, cls) {
    while (node && node !== document) {
      if (node.classList && node.classList.contains(cls)) { return node; }
      node = node.parentNode;
    }
    return null;
  }
  function nodeEl(key) {
    var list = nodesEl.children;
    for (var i = 0; i < list.length; i++) { if (list[i].dataset.key === key) { return list[i]; } }
    return null;
  }

  // ---------------------------------------------------------------- rita
  function applyTheme(t) {
    if (!t) { return; }
    var s = document.documentElement.style;
    if (t.backgroundColor) { s.setProperty("--bg", t.backgroundColor); }
    if (t.secondaryBackgroundColor) { s.setProperty("--panel", t.secondaryBackgroundColor); }
    if (t.textColor) { s.setProperty("--text", t.textColor); }
    if (t.primaryColor) { s.setProperty("--accent", t.primaryColor); }
    if (t.font) { document.body.style.fontFamily = t.font; }
  }
  function applyTransform() {
    world.style.transform = "translate(" + panX + "px," + panY + "px) scale(" + zoom + ")";
    viewport.style.backgroundPosition = panX + "px " + panY + "px";
    viewport.style.backgroundSize = (22 * zoom) + "px " + (22 * zoom) + "px";
    document.getElementById("zoomlabel").textContent = Math.round(zoom * 100) + " %";
  }
  function buildNode(t) {
    var n = el("div", "node" + (t.include ? "" : " excluded") + (sel.table === t.key && !sel.column ? " selected" : ""));
    n.dataset.key = t.key;
    n.style.left = pos[t.key][0] + "px";
    n.style.top = pos[t.key][1] + "px";
    var head = el("div", "head");
    var dot = el("span", "dot");
    dot.style.background = CAT[t.category] || CAT.other;
    head.appendChild(dot);
    head.appendChild(el("span", "tname", t.name));
    head.appendChild(el("span", "rows", t.rowsLabel));
    head.title = t.key;
    n.appendChild(head);
    n.appendChild(el("div", "sub", t.sub));
    t.columns.forEach(function (c) {
      var cls = "col" + (sel.table === t.key && sel.column === c.name ? " selected" : "") + (c.low ? " low" : "") + (c.nullable ? "" : " notnull");
      var r = el("div", cls);
      r.dataset.col = c.name;
      r.title = c.name + " · " + c.type + (c.nullable ? "" : " NOT NULL") + " · " + c.gen + (c.low ? " (gissning – kontrollera)" : "");
      r.appendChild(el("span", "badge" + (c.pk ? " pk" : c.fk ? " fk" : ""), c.pk ? "PK" : c.fk ? "FK" : c.unique ? "U" : ""));
      r.appendChild(el("span", "cname", c.name));
      r.appendChild(el("span", "ctype", c.type));
      r.appendChild(el("span", "cgen", c.gen));
      r.appendChild(el("span", "handle"));
      n.appendChild(r);
    });
    n.appendChild(el("div", "addcol", "+ Lägg till kolumn"));
    return n;
  }
  function anchor(key, colName) {
    var n = nodeEl(key);
    if (!n) { return null; }
    var row = null, rows = n.querySelectorAll(".col");
    for (var i = 0; i < rows.length; i++) { if (rows[i].dataset.col === colName) { row = rows[i]; break; } }
    return { x1: n.offsetLeft, x2: n.offsetLeft + n.offsetWidth, y: n.offsetTop + (row ? row.offsetTop + row.offsetHeight / 2 : 16) };
  }
  function route(a, b) {  // a = barnets kolumn, b = förälderns kolumn
    var sx, ex, sd, ed;
    if (a.x2 + 36 < b.x1) { sx = a.x2; sd = 1; ex = b.x1; ed = -1; }
    else if (b.x2 + 36 < a.x1) { sx = a.x1; sd = -1; ex = b.x2; ed = 1; }
    else { sx = a.x2; sd = 1; ex = b.x2; ed = 1; }
    var k = Math.max(46, Math.abs(ex - sx) / 2);
    return { d: "M " + sx + " " + a.y + " C " + (sx + sd * k) + " " + a.y + ", " + (ex + ed * k) + " " + b.y + ", " + ex + " " + b.y,
             mx: (sx + ex) / 2 + (sd === ed ? sd * k * 0.75 : 0), my: (a.y + b.y) / 2 };
  }
  function drawEdges() {
    while (svg.firstChild) { svg.removeChild(svg.firstChild); }
    while (over.firstChild) { over.removeChild(over.firstChild); }
    var defs = sv("defs", {});
    [["arrow", "var(--edge)"], ["arrowsel", "var(--accent)"]].forEach(function (m) {
      var marker = sv("marker", { id: m[0], viewBox: "0 0 10 10", refX: "9", refY: "5", markerWidth: "7", markerHeight: "7", orient: "auto-start-reverse" });
      var p = sv("path", { d: "M 0 0 L 10 5 L 0 10 z" });
      p.style.fill = m[1];
      marker.appendChild(p);
      defs.appendChild(marker);
    });
    svg.appendChild(defs);
    if (!args) { return; }
    args.relations.forEach(function (r) {
      var a = anchor(r.from, r.fromCols[0]), b = anchor(r.to, r.toCols[0]);
      if (!a || !b) { return; }
      var selected = sel.table === r.from && r.fromCols.indexOf(sel.column) >= 0;
      var rt = route(a, b);
      svg.appendChild(sv("path", { d: rt.d, "class": "edge" + (r.manual ? " manual" : "") + (selected ? " sel" : ""),
                                   "marker-end": "url(#" + (selected ? "arrowsel" : "arrow") + ")" }));
      var hit = sv("path", { d: rt.d, "class": "hit" });
      hit.dataset.from = r.from;
      hit.dataset.col = r.fromCols[0];
      var tip = sv("title", {});
      tip.textContent = r.from + "." + r.fromCols.join(", ") + " → " + r.to + "." + r.toCols.join(", ") + (r.label ? " (" + r.label + ")" : "") + " – klicka för att redigera";
      hit.appendChild(tip);
      svg.appendChild(hit);
      if (r.label) {
        var lab = sv("text", { x: rt.mx, y: rt.my - 5, "class": "elabel" });
        lab.textContent = r.label;
        svg.appendChild(lab);
      }
    });
    (args.suggestions || []).forEach(function (s, i) {
      var a = anchor(s.from, s.col), b = anchor(s.to, s.toCol);
      if (!a || !b) { return; }
      var rt = route(a, b);
      svg.appendChild(sv("path", { d: rt.d, "class": "edge sugg", "marker-end": "url(#arrowsel)" }));
      var g = sv("g", { "class": "suggbtn", transform: "translate(" + rt.mx + "," + rt.my + ")" });
      g.dataset.sugg = String(i);
      g.appendChild(sv("circle", { r: "10" }));
      var plus = sv("text", {});
      plus.textContent = "+";
      g.appendChild(plus);
      var tip = sv("title", {});
      tip.textContent = "Förslag: " + s.from + "." + s.col + " → " + s.to + "." + s.toCol + " – klicka för att lägga till";
      g.appendChild(tip);
      over.appendChild(g);  // ovanpå tabellerna, så att knappen alltid går att nå
    });
    if (tempPath) { over.appendChild(tempPath); }
  }
  function redraw() {
    while (nodesEl.firstChild) { nodesEl.removeChild(nodesEl.firstChild); }
    (args ? args.tables : []).forEach(function (t) { nodesEl.appendChild(buildNode(t)); });
    drawEdges();
    document.getElementById("empty").style.display = args && args.tables.length ? "none" : "flex";
  }
  function fit() {
    var list = nodesEl.children;
    if (!list.length) { zoom = 1; panX = 24; panY = 24; applyTransform(); return; }
    var x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (var i = 0; i < list.length; i++) {
      var n = list[i];
      x1 = Math.min(x1, n.offsetLeft); y1 = Math.min(y1, n.offsetTop);
      x2 = Math.max(x2, n.offsetLeft + n.offsetWidth); y2 = Math.max(y2, n.offsetTop + n.offsetHeight);
    }
    var vw = viewport.clientWidth || 900, vh = viewport.clientHeight || 600, pad = 28;
    zoom = Math.max(0.25, Math.min(1, (vw - 2 * pad) / (x2 - x1), (vh - 2 * pad) / (y2 - y1)));
    panX = pad - x1 * zoom + Math.max(0, (vw - 2 * pad - (x2 - x1) * zoom) / 2);
    panY = pad - y1 * zoom;
    applyTransform();
  }
  function frameHeight() {
    // maximerat läge: fyll fönstret nedanför diagrammets överkant (sidan ligger på samma ursprung som komponenten)
    if (!args || !args.fill) { return args ? args.height || 660 : 660; }
    try {
      var doc = window.parent.document, top = window.frameElement.getBoundingClientRect().top;
      var main = doc.querySelector('[data-testid="stMain"]');
      top += (main ? main.scrollTop : 0) + (doc.scrollingElement ? doc.scrollingElement.scrollTop : 0);
      return Math.max(420, Math.round(window.parent.innerHeight - top - 12));
    } catch (err) {
      return Math.max(args.height || 660, 820);
    }
  }
  var lastHeight = 0, refitUntil = 0, fitTimers = [];
  function scheduleFit() {
    // anpassa zoomen tills ramen har fått sin slutliga storlek (Streamlit kan bygga om sidan i flera steg)
    fitTimers.forEach(window.clearTimeout);
    refitUntil = Date.now() + 2000;
    fitTimers = [0, 250, 1200, 2500].map(function (ms) { return window.setTimeout(fit, ms); });
  }
  function userTookOver() { fitTimers.forEach(window.clearTimeout); fitTimers = []; refitUntil = 0; }
  // när ramen byter storlek (maximera, avsluta, ändrat fönster) anpassas zoomen till den nya ytan
  if (window.ResizeObserver) {
    new ResizeObserver(function () {
      if (Date.now() < refitUntil) { fit(); refitUntil = Math.max(refitUntil, Date.now() + 800); }  // så länge storleken ändras
    }).observe(viewport);
  }
  function sizeFrame() {
    var h = frameHeight();
    if (h !== lastHeight) {
      lastHeight = h;
      post("streamlit:setFrameHeight", { height: h });
    }
  }
  function setMax(on) { emit({ type: "maximize", on: on }); }
  document.getElementById("maxbtn").addEventListener("click", function () { setMax(!(args && args.maximized)); });
  function onKey(e) { if (e.key === "Escape" && args && args.maximized && !drag) { setMax(false); } }
  window.addEventListener("keydown", onKey);
  try {  // Esc ska fungera även när fokus ligger i panelen bredvid diagrammet
    var pw = window.parent;
    if (pw.__dummyfillerEsc) { pw.document.removeEventListener("keydown", pw.__dummyfillerEsc); }
    pw.__dummyfillerEsc = onKey;
    pw.document.addEventListener("keydown", onKey);
    pw.addEventListener("resize", function () { if (args && args.fill) { sizeFrame(); scheduleFit(); } });
  } catch (err) { /* annat ursprung: bara Esc inne i diagrammet */ }

  function render(a) {
    if (drag) { pendingArgs = a; return; }
    var wasMax = args ? !!args.maximized : null;
    args = a;
    var mb = document.getElementById("maxbtn");
    mb.textContent = a.maximized ? "✕ Avsluta (Esc)" : "⛶ Maximera";
    mb.classList.toggle("on", !!a.maximized);
    if (a.selNonce !== selNonce) { selNonce = a.selNonce; sel = a.selected || { table: null, column: null }; }
    pos = {};
    a.tables.forEach(function (t) { pos[t.key] = [t.x, t.y]; });
    var legend = document.getElementById("legend");
    while (legend.firstChild) { legend.removeChild(legend.firstChild); }
    (a.legend || []).forEach(function (item) {
      var s = el("span"), d = el("span", "dot");
      d.style.background = CAT[item[0]] || CAT.other;
      s.appendChild(d);
      s.appendChild(document.createTextNode(item[1]));
      legend.appendChild(s);
    });
    sizeFrame();
    if (a.fill) { window.setTimeout(sizeFrame, 150); window.setTimeout(sizeFrame, 600); }  // sidan hinner ändra layout
    redraw();
    if ((wasMax !== null && wasMax !== !!a.maximized) || a.layoutNonce !== layoutNonce || (!fitted && a.tables.length)) {
      layoutNonce = a.layoutNonce;  // ny storlek, ny placering eller nystartad ruta: visa hela diagrammet
      fitted = a.tables.length > 0;
      scheduleFit();
    }
    applyTransform();
  }

  // ---------------------------------------------------------------- interaktion
  function setSelection(table, column) {
    sel = { table: table, column: column };
    redraw();
    emit({ type: "select", table: table, column: column });
  }
  function worldPoint(e) {
    var r = viewport.getBoundingClientRect();
    return [(e.clientX - r.left - panX) / zoom, (e.clientY - r.top - panY) / zoom];
  }
  function clearDrop() {
    var d = nodesEl.querySelectorAll(".col.drop");
    for (var i = 0; i < d.length; i++) { d[i].classList.remove("drop"); }
  }
  function colUnder(e, notKey) {
    var t = document.elementFromPoint(e.clientX, e.clientY);
    var row = closest(t, "col"), node = closest(t, "node");
    return row && node && node.dataset.key !== notKey ? { key: node.dataset.key, col: row.dataset.col, row: row } : null;
  }
  viewport.addEventListener("pointerdown", function (e) {
    if (e.button !== 0 || !args) { return; }
    var t = e.target, node = closest(t, "node");
    if (t.classList && t.classList.contains("handle") && node) {
      var row = closest(t, "col"), a = anchor(node.dataset.key, row.dataset.col);
      tempPath = sv("path", { "class": "edge temp", "marker-end": "url(#arrowsel)" });
      drag = { kind: "link", from: node.dataset.key, col: row.dataset.col, x: a.x2, y: a.y };
      nodesEl.classList.add("linking");
      over.appendChild(tempPath);
    } else if (node && (closest(t, "head") || closest(t, "sub"))) {
      drag = { kind: "node", key: node.dataset.key, el: node, sx: e.clientX, sy: e.clientY, ox: pos[node.dataset.key][0], oy: pos[node.dataset.key][1], moved: false };
    } else if (node) {
      drag = { kind: "click", node: node, target: t };
    } else {
      userTookOver();
      drag = { kind: "pan", sx: e.clientX, sy: e.clientY, ox: panX, oy: panY, moved: false, target: t };
      viewport.classList.add("panning");
    }
    e.preventDefault();
  });
